<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rainbow Border Gradient -->
    <linearGradient id="ar-rainbow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="25%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="75%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="25%" stop-color="#1a7f37"/>
      <stop offset="50%" stop-color="#8250df"/>
      <stop offset="75%" stop-color="#cf222e"/>
      <stop offset="100%" stop-color="#0969da"/>
    </linearGradient>

    <linearGradient id="wave-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0.0"/>
    </linearGradient>

    <style>
      :root {
        --text-s: #8b949e;
        --glass-bg: rgba(255, 255, 255, 0.04);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --text-s: #59636e;
          --glass-bg: rgba(0, 0, 0, 0.02);
        }
      }
      @keyframes rainbowShift {
        0% { filter: hue-rotate(0deg); }
        50% { filter: hue-rotate(180deg); }
        100% { filter: hue-rotate(360deg); }
      }
      .ar-rainbow { animation: rainbowShift 10s linear infinite; }
      .ar-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: var(--text-s); }
      .g-outer { fill: var(--glass-bg); }
    </style>
  </defs>

  <!-- Fully Transparent Liquid Glass Base -->
  <rect x="5" y="5" width="890" height="170" rx="14" class="g-outer"/>
  <rect x="5" y="5" width="890" height="170" rx="14" fill="none" stroke="url(#ar-rainbow-border)" stroke-width="1.8" class="ar-rainbow"/>

  <!-- Top Header -->
  <text x="30" y="32" fill="#0969da" class="ar-mono" font-size="11" font-weight="700" letter-spacing="1">LIFETIME CONTRIBUTION STREAM // HIGH VELOCITY ENGINEERING RADAR</text>
  <text x="745" y="32" class="ar-mono" font-size="10.5">ACTIVE BURSTS ⚡</text>

  <!-- Wave Graph Area -->
  <g transform="translate(30, 45)">
    <line x1="0" y1="25" x2="840" y2="25" stroke="rgba(128,128,128,0.15)" stroke-dasharray="4 4"/>
    <line x1="0" y1="55" x2="840" y2="55" stroke="rgba(128,128,128,0.15)" stroke-dasharray="4 4"/>
    <line x1="0" y1="85" x2="840" y2="85" stroke="rgba(128,128,128,0.15)" stroke-dasharray="4 4"/>

    <!-- Wave Fill -->
    <path d="M 0 85 Q 70 30 140 60 T 280 40 T 420 15 T 560 50 T 700 20 T 840 45 L 840 105 L 0 105 Z" fill="url(#wave-fill)"/>

    <!-- Primary Wave Line -->
    <path d="M 0 85 Q 70 30 140 60 T 280 40 T 420 15 T 560 50 T 700 20 T 840 45" fill="none" stroke="url(#wave-gradient)" stroke-width="3" stroke-linecap="round"/>

    <!-- Secondary Harmonic Wave -->
    <path d="M 0 70 Q 70 50 140 25 T 280 65 T 420 35 T 560 20 T 700 55 T 840 30" fill="none" stroke="rgba(207,34,46,0.4)" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Data Points -->
    <circle cx="140" cy="60" r="4" fill="#0969da" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="280" cy="40" r="4" fill="#1a7f37" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="420" cy="15" r="5" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
    <circle cx="560" cy="50" r="4" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="700" cy="20" r="5" fill="#cf222e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="840" cy="45" r="4" fill="#0969da" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Bottom Timeline Labels -->
    <text x="0" y="118" class="ar-mono" font-size="9">FOUNDATIONS</text>
    <text x="210" y="118" class="ar-mono" font-size="9">SYSTEM SIMULATIONS</text>
    <text x="420" y="118" fill="#0969da" class="ar-mono" font-size="9" font-weight="700">3D WEBGL &amp; SAAS</text>
    <text x="610" y="118" class="ar-mono" font-size="9">ENTERPRISE SQL &amp; C++ ENGINE</text>
    <text x="800" y="118" fill="#1a7f37" class="ar-mono" font-size="9" font-weight="700">SCALE 🚀</text>
  </g>
</svg>
