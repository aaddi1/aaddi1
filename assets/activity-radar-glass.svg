<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ar-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080b12" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="25%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#ff007a"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="wave-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="ar-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="ar-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>

    <style>
      .ar-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="900" height="180" rx="16" fill="#080b12"/>
  <rect width="900" height="180" rx="16" fill="url(#ar-glow)"/>
  <rect width="900" height="180" rx="16" fill="url(#ar-grid)"/>
  <rect width="900" height="180" rx="16" fill="none" stroke="url(#ar-border)" stroke-width="1.2"/>

  <!-- Top Glass Header -->
  <text x="30" y="32" fill="#00f2fe" class="ar-mono" font-size="11" font-weight="700" letter-spacing="1">LIFETIME CONTRIBUTION STREAM // HIGH VELOCITY ENGINEERING RADAR</text>
  <text x="745" y="32" fill="rgba(255,255,255,0.5)" class="ar-mono" font-size="10.5">ACTIVE BURSTS ⚡</text>

  <!-- Wave Graph Area -->
  <g transform="translate(30, 45)">
    <!-- Baseline Grid Lines -->
    <line x1="0" y1="25" x2="840" y2="25" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4"/>
    <line x1="0" y1="55" x2="840" y2="55" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4"/>
    <line x1="0" y1="85" x2="840" y2="85" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4"/>

    <!-- Wave Fill -->
    <path d="M 0 85 Q 70 30 140 60 T 280 40 T 420 15 T 560 50 T 700 20 T 840 45 L 840 105 L 0 105 Z" fill="url(#wave-fill)"/>

    <!-- Primary Glowing Wave Line -->
    <path d="M 0 85 Q 70 30 140 60 T 280 40 T 420 15 T 560 50 T 700 20 T 840 45" fill="none" stroke="url(#wave-gradient)" stroke-width="3" stroke-linecap="round"/>

    <!-- Secondary Harmonic Wave -->
    <path d="M 0 70 Q 70 50 140 25 T 280 65 T 420 35 T 560 20 T 700 55 T 840 30" fill="none" stroke="rgba(255,0,122,0.4)" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Data Points -->
    <circle cx="140" cy="60" r="4" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="280" cy="40" r="4" fill="#4facfe" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="420" cy="15" r="5" fill="#00f2fe" stroke="#ffffff" stroke-width="2"/>
    <circle cx="560" cy="50" r="4" fill="#c084fc" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="700" cy="20" r="5" fill="#ff007a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="840" cy="45" r="4" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Bottom Timeline Labels -->
    <text x="0" y="118" fill="rgba(255,255,255,0.4)" class="ar-mono" font-size="9">FOUNDATIONS</text>
    <text x="210" y="118" fill="rgba(255,255,255,0.4)" class="ar-mono" font-size="9">SYSTEM SIMULATIONS</text>
    <text x="420" y="118" fill="#00f2fe" class="ar-mono" font-size="9" font-weight="700">3D WEBGL &amp; SAAS</text>
    <text x="630" y="118" fill="rgba(255,255,255,0.4)" class="ar-mono" font-size="9">CLAUDE AI &amp; CERTIFICATIONS</text>
    <text x="800" y="118" fill="#00f5a0" class="ar-mono" font-size="9" font-weight="700">SCALE 🚀</text>
  </g>
</svg>
