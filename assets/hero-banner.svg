<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Chromatic Rainbow Iridescent Border Gradient -->
    <linearGradient id="rainbow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="25%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="75%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <!-- Metallic Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <style>
      @keyframes rainbowShift {
        0% { filter: hue-rotate(0deg); }
        50% { filter: hue-rotate(180deg); }
        100% { filter: hue-rotate(360deg); }
      }
      .rainbow-edge {
        animation: rainbowShift 8s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- High-Contrast Glassmorphic Card (Crystal Clear on Both Light & Dark) -->
  <g transform="translate(10, 10)">
    <rect width="830" height="180" rx="14" fill="#0d1117" stroke="url(#rainbow-border)" stroke-width="2" class="rainbow-edge"/>

    <!-- Top Window Controls -->
    <circle cx="24" cy="22" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="22" r="5" fill="#27c93f"/>

    <!-- System Header Title -->
    <text x="72" y="26" fill="#8b949e" class="mono-text" font-size="11" font-weight="600">aryan-sharma / 3d-fullstack-engineer</text>

    <!-- Location Badge -->
    <rect x="690" y="12" width="124" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="702" cy="22" r="3" fill="#3fb950"/>
    <text x="712" y="25" fill="#c9d1d9" class="mono-text" font-size="9" font-weight="700">TUNDLA, INDIA</text>

    <line x1="0" y1="38" x2="830" y2="38" stroke="#21262d" stroke-width="1"/>

    <!-- Main Headline -->
    <text x="24" y="80" fill="url(#title-grad)" class="title-text" font-size="32">Aryan Sharma</text>
    <text x="24" y="104" fill="#58a6ff" class="sub-text" font-size="13.5">3D Creative Engineer  •  Full-Stack Systems Architect</text>

    <!-- Craft Narrative -->
    <text x="24" y="128" fill="#8b949e" class="body-text" font-size="12">
      Building custom Node.js servers, PostgreSQL relational schemas, C++ analytics, and spatial 3D WebGL experiences.
    </text>

    <!-- 4 Clean Tech Tags (Row) -->
    <g transform="translate(24, 142)">
      <rect x="0" y="0" width="165" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="10" y="16" fill="#58a6ff" class="mono-text" font-size="10" font-weight="600">🌐 Three.js &amp; WebGL</text>

      <rect x="175" y="0" width="160" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="10" y="16" transform="translate(175, 0)" fill="#3fb950" class="mono-text" font-size="10" font-weight="600">🖥️ Node.js Servers</text>

      <rect x="345" y="0" width="175" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="10" y="16" transform="translate(345, 0)" fill="#79c0ff" class="mono-text" font-size="10" font-weight="600">🗄️ PostgreSQL &amp; SQL</text>

      <rect x="530" y="0" width="165" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="10" y="16" transform="translate(530, 0)" fill="#d2a8ff" class="mono-text" font-size="10" font-weight="600">⚡ C++ Computation</text>
    </g>
  </g>
</svg>
