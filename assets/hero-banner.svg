<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient Mesh -->
    <radialGradient id="bg-glow-1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ff007a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0052d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Glass Fill Gradient -->
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="sub-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f2fe" flood-opacity="0.15"/>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <circle cx="30" cy="0" r="1" fill="rgba(0,242,254,0.15)"/>
    </pattern>

    <style>
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes glowShimmer {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
      }
      .hud-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', sans-serif;
        font-weight: 900;
        letter-spacing: 3px;
      }
      .hud-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', sans-serif;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .hud-mono {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      }
      .floating-glass {
        animation: floatPulse 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Deep Base -->
  <rect width="900" height="280" rx="20" fill="#070a12"/>
  <rect width="900" height="280" rx="20" fill="url(#bg-glow-3)"/>
  <rect width="900" height="280" rx="20" fill="url(#bg-glow-1)"/>
  <rect width="900" height="280" rx="20" fill="url(#bg-glow-2)"/>
  <rect width="900" height="280" rx="20" fill="url(#cyber-grid)"/>

  <!-- Apple Liquid Glass Main Card Panel -->
  <g class="floating-glass" filter="url(#glass-shadow)">
    <!-- Frosted Panel Body -->
    <rect x="25" y="20" width="850" height="240" rx="16" fill="url(#glass-fill)"/>
    <rect x="25" y="20" width="850" height="240" rx="16" fill="none" stroke="url(#glass-border)" stroke-width="1.5"/>

    <!-- Specular Gloss Highlight Top Edge -->
    <path d="M 30 22 L 870 22" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Window Controls (Apple Traffic Lights) -->
    <circle cx="50" cy="42" r="5.5" fill="#ff5f56" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/>
    <circle cx="68" cy="42" r="5.5" fill="#ffbd2e" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/>
    <circle cx="86" cy="42" r="5.5" fill="#27c93f" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/>

    <!-- HUD System Header Text -->
    <text x="110" y="46" fill="rgba(255,255,255,0.6)" class="hud-mono" font-size="11" font-weight="600" letter-spacing="1">ARYAN_OS // 3D_SPATIAL_KERNEL // v2.6</text>
    <rect x="730" y="34" width="125" height="18" rx="9" fill="rgba(0,242,254,0.12)" stroke="rgba(0,242,254,0.4)" stroke-width="1"/>
    <circle cx="742" cy="43" r="3" fill="#00f2fe"/>
    <text x="752" y="46" fill="#00f2fe" class="hud-mono" font-size="9.5" font-weight="700">ONLINE • TUNDLA</text>

    <!-- Main Headline -->
    <text x="50" y="105" fill="url(#text-gradient)" class="hud-title" font-size="40">ARYAN SHARMA</text>
    <text x="50" y="132" fill="url(#sub-gradient)" class="hud-sub" font-size="14.5">3D CREATIVE ENGINEER  •  FULL-STACK ARCHITECT  •  AI SYSTEMS</text>

    <!-- Bio / Mission Subtitle -->
    <text x="50" y="162" fill="rgba(255,255,255,0.85)" font-family="-apple-system, sans-serif" font-size="13" font-weight="400">
      Crafting hyper-aesthetic 3D web experiences, Apple Liquid Glass UI, and enterprise-grade platforms.
    </text>

    <!-- Liquid Glass Feature Pills (Row) -->
    <g transform="translate(50, 185)">
      <!-- Pill 1: 3D Spatial Web -->
      <rect x="0" y="0" width="165" height="34" rx="17" fill="rgba(0,242,254,0.08)" stroke="rgba(0,242,254,0.4)" stroke-width="1"/>
      <text x="18" y="21" fill="#00f2fe" class="hud-mono" font-size="11" font-weight="600">⚡ Three.js / WebGL</text>

      <!-- Pill 2: Full-Stack SaaS -->
      <rect x="175" y="0" width="185" height="34" rx="17" fill="rgba(121,40,202,0.12)" stroke="rgba(121,40,202,0.5)" stroke-width="1"/>
      <text x="193" y="21" fill="#c084fc" class="hud-mono" font-size="11" font-weight="600">🚀 Node • Python • C++</text>

      <!-- Pill 3: Claude Code AI -->
      <rect x="370" y="0" width="185" height="34" rx="17" fill="rgba(255,0,122,0.1)" stroke="rgba(255,0,122,0.45)" stroke-width="1"/>
      <text x="388" y="21" fill="#ff76ac" class="hud-mono" font-size="11" font-weight="600">🤖 Claude Code / Agentic</text>

      <!-- Pill 4: 17+ Verified Certs -->
      <rect x="565" y="0" width="185" height="34" rx="17" fill="rgba(79,172,254,0.1)" stroke="rgba(79,172,254,0.45)" stroke-width="1"/>
      <text x="583" y="21" fill="#4facfe" class="hud-mono" font-size="11" font-weight="600">🏆 17+ Verified Credentials</text>
    </g>
  </g>
</svg>
