<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Ambient GitHub Dark Gradients -->
    <radialGradient id="gh-glow-blue" cx="15%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gh-glow-green" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- GitHub Glass Card Fill -->
    <linearGradient id="gh-glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95"/>
    </linearGradient>

    <!-- GitHub Card Border -->
    <linearGradient id="gh-glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>

    <!-- Clean Title Gradient -->
    <linearGradient id="gh-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>

    <style>
      .gh-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .gh-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
      }
      .gh-mono {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      .gh-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="900" height="280" rx="16" fill="#0d1117"/>
  <rect width="900" height="280" rx="16" fill="url(#gh-glow-blue)"/>
  <rect width="900" height="280" rx="16" fill="url(#gh-glow-green)"/>
  <rect width="900" height="280" rx="16" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Main Card Panel -->
  <g transform="translate(25, 20)">
    <!-- Panel Base -->
    <rect width="850" height="240" rx="12" fill="url(#gh-glass-fill)"/>
    <rect width="850" height="240" rx="12" fill="none" stroke="url(#gh-glass-border)" stroke-width="1.2"/>

    <!-- Window Controls (Subtle Apple traffic lights) -->
    <circle cx="28" cy="24" r="5" fill="#ff5f56"/>
    <circle cx="44" cy="24" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="24" r="5" fill="#27c93f"/>

    <!-- System Header Text -->
    <text x="80" y="28" fill="#8b949e" class="gh-mono" font-size="11" font-weight="500">aryan-sharma / profile</text>

    <!-- Location Pill -->
    <rect x="705" y="14" width="130" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="718" cy="24" r="3.5" fill="#3fb950"/>
    <text x="728" y="27" fill="#8b949e" class="gh-mono" font-size="10" font-weight="600">TUNDLA, INDIA</text>

    <line x1="0" y1="42" x2="850" y2="42" stroke="#21262d" stroke-width="1"/>

    <!-- Main Headline -->
    <text x="28" y="90" fill="url(#gh-title-grad)" class="gh-title" font-size="34">Aryan Sharma</text>
    <text x="28" y="118" fill="#58a6ff" class="gh-sub" font-size="14">3D Creative Engineer &amp; Full-Stack Systems Architect</text>

    <!-- Bio / Craft Statement -->
    <text x="28" y="148" fill="#8b949e" class="gh-body" font-size="13">
      Engineering custom Node.js servers, PostgreSQL database schemas, C++ analytics, and Three.js 3D web experiences.
    </text>

    <!-- 4 Clean Tech Tags -->
    <g transform="translate(28, 175)">
      <!-- Pill 1: Three.js -->
      <rect x="0" y="0" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="20" fill="#58a6ff" class="gh-mono" font-size="11" font-weight="600">🌐 Three.js &amp; WebGL</text>

      <!-- Pill 2: Backend -->
      <rect x="192" y="0" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="20" transform="translate(192, 0)" fill="#3fb950" class="gh-mono" font-size="11" font-weight="600">🖥️ Node.js &amp; Express</text>

      <!-- Pill 3: SQL -->
      <rect x="384" y="0" width="190" height="32" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="20" transform="translate(384, 0)" fill="#79c0ff" class="gh-mono" font-size="11" font-weight="600">🗄️ PostgreSQL &amp; SQL</text>

      <!-- Pill 4: C++ -->
      <rect x="586" y="0" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="20" transform="translate(586, 0)" fill="#d2a8ff" class="gh-mono" font-size="11" font-weight="600">⚡ C++ Computation</text>
    </g>
  </g>
</svg>
