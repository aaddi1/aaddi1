<svg width="860" height="240" viewBox="0 0 860 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Chromatic Rainbow Iridescent Border Gradient -->
    <linearGradient id="rainbow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="25%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="75%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <!-- Metallic Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <style>
      @keyframes rainbowShift {
        0% { filter: hue-rotate(0deg); }
        50% { filter: hue-rotate(180deg); }
        100% { filter: hue-rotate(360deg); }
      }
      .rainbow-edge {
        animation: rainbowShift 8s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- High-Contrast Glassmorphic Card (Zero Overlap & Generous Spacing) -->
  <g transform="translate(10, 10)">
    <rect width="840" height="220" rx="14" fill="#0d1117" stroke="url(#rainbow-border)" stroke-width="2" class="rainbow-edge"/>

    <!-- Top Window Controls -->
    <circle cx="26" cy="24" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="24" r="5" fill="#ffbd2e"/>
    <circle cx="58" cy="24" r="5" fill="#27c93f"/>

    <!-- System Header Title -->
    <text x="80" y="28" fill="#8b949e" class="mono-text" font-size="11" font-weight="600">aryan-sharma / 3d-fullstack-engineer</text>

    <!-- Location Badge -->
    <rect x="696" y="14" width="126" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="708" cy="24" r="3" fill="#3fb950"/>
    <text x="718" y="27" fill="#c9d1d9" class="mono-text" font-size="9" font-weight="700">TUNDLA, INDIA</text>

    <!-- Top Divider Line -->
    <line x1="0" y1="44" x2="840" y2="44" stroke="#21262d" stroke-width="1"/>

    <!-- Main Headline (y = 92) -->
    <text x="26" y="92" fill="url(#title-grad)" class="title-text" font-size="34">Aryan Sharma</text>

    <!-- Subtitle (y = 122) -->
    <text x="26" y="122" fill="#58a6ff" class="sub-text" font-size="14">3D Creative Engineer  •  Full-Stack Systems Architect</text>

    <!-- Craft Narrative (y = 148) -->
    <text x="26" y="148" fill="#8b949e" class="body-text" font-size="12.5">
      Building custom Node.js servers, PostgreSQL relational schemas, C++ analytics, and spatial 3D WebGL experiences.
    </text>

    <!-- 4 Clean Tech Tags (y = 172 to 204) -->
    <g transform="translate(26, 172)">
      <!-- Tag 1: Three.js -->
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="14" y="18" fill="#58a6ff" class="mono-text" font-size="10" font-weight="600">🌐 Three.js &amp; WebGL</text>

      <!-- Tag 2: Backend -->
      <rect x="194" y="0" width="180" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="14" y="18" transform="translate(194, 0)" fill="#3fb950" class="mono-text" font-size="10" font-weight="600">🖥️ Node.js Servers</text>

      <!-- Tag 3: SQL -->
      <rect x="388" y="0" width="190" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="14" y="18" transform="translate(388, 0)" fill="#79c0ff" class="mono-text" font-size="10" font-weight="600">🗄️ PostgreSQL &amp; SQL</text>

      <!-- Tag 4: C++ -->
      <rect x="592" y="0" width="180" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="14" y="18" transform="translate(592, 0)" fill="#d2a8ff" class="mono-text" font-size="10" font-weight="600">⚡ C++ Computation</text>
    </g>
  </g>
</svg>
