<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .lm-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .lm-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .lm-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="320" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Header -->
  <rect x="20" y="16" width="860" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="36" cy="33" r="4" fill="#58a6ff"/>
  <text x="48" y="37" fill="#c9d1d9" class="lm-mono" font-size="11" font-weight="600">PROGRAMMING LANGUAGES &amp; TECHNICAL ECOSYSTEM</text>
  <text x="740" y="37" fill="#8b949e" class="lm-mono" font-size="10.5">POLYGLOT STACK</text>

  <!-- Left Column: Core Backend, Systems & Logic -->
  <g transform="translate(25, 64)">
    <!-- JavaScript (ESNext) -->
    <g transform="translate(0, 0)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#f1e05a"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">JavaScript (ESNext)</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Async Servers &amp; 3D Engine</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(0, 48)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#3178c6"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">TypeScript</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Type-Safe API Contracts</text>
    </g>

    <!-- Python -->
    <g transform="translate(0, 96)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#3572A5"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">Python</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Predictive Business Analytics</text>
    </g>

    <!-- C++ -->
    <g transform="translate(0, 144)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#f34b7d"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">C++</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Compiled High-Speed Modules</text>
    </g>

    <!-- Java -->
    <g transform="translate(0, 192)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#b07219"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">Java</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Oracle Certified OOP Logic</text>
    </g>
  </g>

  <!-- Right Column: Database, 3D Graphics & Web Tech -->
  <g transform="translate(460, 64)">
    <!-- SQL / PostgreSQL -->
    <g transform="translate(0, 0)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#336791"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">SQL / PostgreSQL</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Relational DB &amp; Schemas</text>
    </g>

    <!-- HTML5 & Canvas 2D/3D -->
    <g transform="translate(0, 48)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#e34c26"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">HTML5 &amp; Canvas</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">2D/3D Canvas Rendering</text>
    </g>

    <!-- CSS3 -->
    <g transform="translate(0, 96)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#563d7c"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">CSS3 &amp; SCSS</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Responsive Design Systems</text>
    </g>

    <!-- GLSL & Shaders -->
    <g transform="translate(0, 144)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#58a6ff"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">GLSL &amp; WebGL</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Lighting &amp; Shaders Engine</text>
    </g>

    <!-- C# & Bash -->
    <g transform="translate(0, 192)">
      <rect width="415" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4.5" fill="#178600"/>
      <text x="30" y="24" fill="#f0f6fc" class="lm-bold" font-size="12">C# &amp; Shell Scripting</text>
      <text x="210" y="24" fill="#8b949e" class="lm-mono" font-size="9.5">Blazor WebAssembly &amp; CLI</text>
    </g>
  </g>
</svg>
