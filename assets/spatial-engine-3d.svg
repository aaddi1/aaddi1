<svg width="850" height="190" viewBox="0 0 850 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Chromatic Rainbow Iridescent Border Gradient -->
    <linearGradient id="sp-rainbow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="25%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="75%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <style>
      @keyframes rainbowShift {
        0% { filter: hue-rotate(0deg); }
        50% { filter: hue-rotate(180deg); }
        100% { filter: hue-rotate(360deg); }
      }
      @keyframes spinWireframe {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 3; fill: #58a6ff; opacity: 1; }
        50% { r: 4.5; fill: #3fb950; opacity: 0.8; }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
      }
      .sp-rainbow { animation: rainbowShift 8s linear infinite; }
      .sp-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .sp-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
      .sp-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .rotating-mesh { transform-origin: 90px 95px; animation: spinWireframe 20s linear infinite; }
      .node-pulse { animation: pulseNode 2.5s infinite ease-in-out; }
      .flow-stream { stroke-dasharray: 6 4; animation: orbitFlow 4s linear infinite; }
    </style>
  </defs>

  <!-- High-Contrast Glassmorphic Card Frame -->
  <g transform="translate(10, 10)">
    <rect width="830" height="170" rx="12" fill="#0d1117" stroke="url(#sp-rainbow-border)" stroke-width="2" class="sp-rainbow"/>

    <!-- Left: Animated 3D Isometric Wireframe Engine -->
    <g class="rotating-mesh">
      <circle cx="90" cy="85" r="52" stroke="#30363d" stroke-width="1.2" fill="none"/>
      <circle cx="90" cy="85" r="42" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="1" fill="none" class="flow-stream"/>

      <polygon points="90,38 130,65 130,105 90,132 50,105 50,65" stroke="#58a6ff" stroke-width="1.5" fill="rgba(88,166,255,0.06)"/>
      <line x1="90" y1="38" x2="90" y2="132" stroke="#3fb950" stroke-width="1" stroke-opacity="0.8"/>
      <line x1="50" y1="65" x2="130" y2="105" stroke="#79c0ff" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="50" y1="105" x2="130" y2="65" stroke="#d2a8ff" stroke-width="1" stroke-opacity="0.6"/>

      <circle cx="90" cy="85" r="4.5" fill="#3fb950"/>
    </g>

    <!-- Vertices Pulsing Nodes -->
    <circle cx="90" cy="38" r="3" fill="#58a6ff" class="node-pulse"/>
    <circle cx="130" cy="65" r="3" fill="#58a6ff" class="node-pulse"/>
    <circle cx="130" cy="105" r="3" fill="#58a6ff" class="node-pulse"/>
    <circle cx="90" cy="132" r="3" fill="#58a6ff" class="node-pulse"/>
    <circle cx="50" cy="105" r="3" fill="#58a6ff" class="node-pulse"/>
    <circle cx="50" cy="65" r="3" fill="#58a6ff" class="node-pulse"/>

    <!-- Right: 3D Spatial Pipeline Narrative & Steps -->
    <g transform="translate(170, 16)">
      <rect x="0" y="0" width="165" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="82" y="14" text-anchor="middle" fill="#58a6ff" class="sp-mono" font-size="9" font-weight="700">3D SPATIAL KINEMATICS</text>

      <text x="0" y="42" fill="#f0f6fc" class="sp-title" font-size="15">Three.js &amp; WebGL Real-Time Graphics Engine</text>
      <text x="0" y="60" fill="#8b949e" class="sp-body" font-size="12">
        Developing custom 3D web applications with GPU rendering, GLSL shaders, camera matrix math, and spatial UI.
      </text>

      <!-- 4 Pipeline Step Pills -->
      <g transform="translate(0, 78)">
        <!-- Step 1 -->
        <rect x="0" y="0" width="150" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
        <text x="10" y="17" fill="#58a6ff" class="sp-mono" font-size="9" font-weight="600">01 // SCENE GRAPH</text>
        <text x="10" y="30" fill="#8b949e" class="sp-body" font-size="9.5">Custom 3D Mesh &amp; Buffers</text>

        <!-- Step 2 -->
        <rect x="158" y="0" width="150" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
        <text x="10" y="17" fill="#3fb950" class="sp-mono" font-size="9" font-weight="600">02 // GLSL SHADERS</text>
        <text x="10" y="30" fill="#8b949e" class="sp-body" font-size="9.5">Raymarching &amp; Real-Time Light</text>

        <!-- Step 3 -->
        <rect x="316" y="0" width="150" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
        <text x="10" y="17" fill="#79c0ff" class="sp-mono" font-size="9" font-weight="600">03 // 24FPS CANVAS</text>
        <text x="10" y="30" fill="#8b949e" class="sp-body" font-size="9.5">Smooth Scroll Kinematics</text>

        <!-- Step 4 -->
        <rect x="474" y="0" width="160" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
        <text x="10" y="17" fill="#d2a8ff" class="sp-mono" font-size="9" font-weight="600">04 // LIQUID GLASS UI</text>
        <text x="10" y="30" fill="#8b949e" class="sp-body" font-size="9.5">Spatial Viewport &amp; Shaders</text>
      </g>
    </g>
  </g>
</svg>
