<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Ambient Glow -->
    <radialGradient id="sp-glow" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes spinWireframe {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 3; fill: #58a6ff; opacity: 1; }
        50% { r: 4.5; fill: #3fb950; opacity: 0.8; }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
      }
      .sp-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .sp-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; }
      .sp-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .rotating-mesh { transform-origin: 90px 100px; animation: spinWireframe 24s linear infinite; }
      .node-pulse { animation: pulseNode 3s infinite ease-in-out; }
      .flow-stream { stroke-dasharray: 6 4; animation: orbitFlow 4s linear infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="900" height="200" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect width="900" height="200" rx="12" fill="url(#sp-glow)"/>

  <!-- Left: Animated 3D Isometric Wireframe Engine -->
  <g class="rotating-mesh">
    <!-- Outer 3D Ring -->
    <circle cx="90" cy="100" r="58" stroke="#30363d" stroke-width="1.2" fill="none"/>
    <circle cx="90" cy="100" r="46" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1" fill="none" class="flow-stream"/>

    <!-- Isometric Octahedron / Cube Wireframe -->
    <polygon points="90,45 135,75 135,125 90,155 45,125 45,75" stroke="#58a6ff" stroke-width="1.5" fill="rgba(88,166,255,0.04)"/>
    <line x1="90" y1="45" x2="90" y2="155" stroke="#3fb950" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="45" y1="75" x2="135" y2="125" stroke="#79c0ff" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="45" y1="125" x2="135" y2="75" stroke="#d2a8ff" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Central Core Node -->
    <circle cx="90" cy="100" r="5" fill="#3fb950"/>
  </g>

  <!-- Vertices Pulsing Nodes -->
  <circle cx="90" cy="45" r="3.5" class="node-pulse"/>
  <circle cx="135" cy="75" r="3.5" class="node-pulse"/>
  <circle cx="135" cy="125" r="3.5" class="node-pulse"/>
  <circle cx="90" cy="155" r="3.5" class="node-pulse"/>
  <circle cx="45" cy="125" r="3.5" class="node-pulse"/>
  <circle cx="45" cy="75" r="3.5" class="node-pulse"/>

  <!-- Right: 3D Spatial Pipeline Narrative & Steps -->
  <g transform="translate(180, 24)">
    <rect x="0" y="0" width="160" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="80" y="14" text-anchor="middle" fill="#58a6ff" class="sp-mono" font-size="9" font-weight="700">3D SPATIAL KINEMATICS</text>

    <text x="0" y="44" fill="#f0f6fc" class="sp-title" font-size="16">Three.js &amp; WebGL Real-Time Graphics Engine</text>
    <text x="0" y="66" fill="#8b949e" class="sp-body" font-size="12.5">
      Developing custom 3D web applications with low-latency GPU rendering, GLSL shaders, camera matrix math, and liquid glass styling.
    </text>

    <!-- 4 Pipeline Step Pills -->
    <g transform="translate(0, 92)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="160" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="18" fill="#58a6ff" class="sp-mono" font-size="9.5" font-weight="600">01 // SCENE GRAPH</text>
      <text x="12" y="32" fill="#8b949e" class="sp-body" font-size="10">Custom 3D Mesh &amp; Buffers</text>

      <!-- Step 2 -->
      <rect x="172" y="0" width="160" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="18" fill="#3fb950" class="sp-mono" font-size="9.5" font-weight="600">02 // GLSL SHADERS</text>
      <text x="12" y="32" fill="#8b949e" class="sp-body" font-size="10">Raymarching &amp; Real-Time Light</text>

      <!-- Step 3 -->
      <rect x="344" y="0" width="160" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="18" fill="#79c0ff" class="sp-mono" font-size="9.5" font-weight="600">03 // 24FPS CANVAS</text>
      <text x="12" y="32" fill="#8b949e" class="sp-body" font-size="10">Smooth Scroll Interpolation</text>

      <!-- Step 4 -->
      <rect x="516" y="0" width="170" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="18" fill="#d2a8ff" class="sp-mono" font-size="9.5" font-weight="600">04 // LIQUID GLASS UI</text>
      <text x="12" y="32" fill="#8b949e" class="sp-body" font-size="10">Spatial Viewport &amp; Shaders</text>
    </g>
  </g>
</svg>
