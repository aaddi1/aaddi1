<svg width="900" height="170" viewBox="0 0 900 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="tr-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06080e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="tr-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="tr-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.6"/>
    </linearGradient>

    <pattern id="tr-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>

    <style>
      .tr-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .tr-title { font-family: -apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="900" height="170" rx="16" fill="#06080e"/>
  <rect width="900" height="170" rx="16" fill="url(#tr-glow)"/>
  <rect width="900" height="170" rx="16" fill="url(#tr-grid)"/>
  <rect width="900" height="170" rx="16" fill="none" stroke="url(#tr-border)" stroke-width="1.5"/>

  <!-- Top Title -->
  <text x="30" y="30" fill="#00f2fe" class="tr-mono" font-size="11" font-weight="700" letter-spacing="1">VERIFIED HONORS &amp; DISTINCTIONS // LIQUID GLASS VAULT</text>
  <text x="740" y="30" fill="rgba(255,255,255,0.6)" class="tr-mono" font-size="10.5">ENGINEERING TIERS 🏆</text>

  <!-- 6 Glass Trophy Badges -->
  <g transform="translate(20, 45)">
    <!-- Badge 1: 3D Spatial -->
    <g transform="translate(0, 0)">
      <rect width="135" height="105" rx="12" fill="url(#tr-glass)" stroke="rgba(0,242,254,0.35)" stroke-width="1"/>
      <text x="67" y="38" text-anchor="middle" font-size="24">🌐</text>
      <text x="67" y="66" text-anchor="middle" fill="#00f2fe" class="tr-title" font-size="10.5">3D SPATIAL</text>
      <text x="67" y="82" text-anchor="middle" fill="rgba(255,255,255,0.75)" class="tr-mono" font-size="8.5">Three.js / WebGL</text>
      <text x="67" y="94" text-anchor="middle" fill="#00f2fe" class="tr-mono" font-size="8">GRADE S+</text>
    </g>

    <!-- Badge 2: Server Architect -->
    <g transform="translate(145, 0)">
      <rect width="135" height="105" rx="12" fill="url(#tr-glass)" stroke="rgba(0,245,160,0.35)" stroke-width="1"/>
      <text x="67" y="38" text-anchor="middle" font-size="24">🖥️</text>
      <text x="67" y="66" text-anchor="middle" fill="#00f5a0" class="tr-title" font-size="10.5">SERVER ARCH</text>
      <text x="67" y="82" text-anchor="middle" fill="rgba(255,255,255,0.75)" class="tr-mono" font-size="8.5">Node.js &amp; Express</text>
      <text x="67" y="94" text-anchor="middle" fill="#00f5a0" class="tr-mono" font-size="8">GRADE S+</text>
    </g>

    <!-- Badge 3: SQL & Database -->
    <g transform="translate(290, 0)">
      <rect width="135" height="105" rx="12" fill="url(#tr-glass)" stroke="rgba(79,172,254,0.35)" stroke-width="1"/>
      <text x="67" y="38" text-anchor="middle" font-size="24">🗄️</text>
      <text x="67" y="66" text-anchor="middle" fill="#4facfe" class="tr-title" font-size="10.5">SQL SCHEMAS</text>
      <text x="67" y="82" text-anchor="middle" fill="rgba(255,255,255,0.75)" class="tr-mono" font-size="8.5">PostgreSQL Engine</text>
      <text x="67" y="94" text-anchor="middle" fill="#4facfe" class="tr-mono" font-size="8">GRADE S+</text>
    </g>

    <!-- Badge 4: C++ Computation -->
    <g transform="translate(435, 0)">
      <rect width="135" height="105" rx="12" fill="url(#tr-glass)" stroke="rgba(121,40,202,0.35)" stroke-width="1"/>
      <text x="67" y="38" text-anchor="middle" font-size="24">⚡</text>
      <text x="67" y="66" text-anchor="middle" fill="#c084fc" class="tr-title" font-size="10.5">C++ ANALYTICS</text>
      <text x="67" y="82" text-anchor="middle" fill="rgba(255,255,255,0.75)" class="tr-mono" font-size="8.5">Compiled Modules</text>
      <text x="67" y="94" text-anchor="middle" fill="#c084fc" class="tr-mono" font-size="8">GRADE S+</text>
    </g>

    <!-- Badge 5: Cloud & Play Store -->
    <g transform="translate(580, 0)">
      <rect width="135" height="105" rx="12" fill="url(#tr-glass)" stroke="rgba(255,153,0,0.35)" stroke-width="1"/>
      <text x="67" y="38" text-anchor="middle" font-size="24">☁️</text>
      <text x="67" y="66" text-anchor="middle" fill="#ffb84d" class="tr-title" font-size="10.5">AWS &amp; GOOGLE</text>
      <text x="67" y="82" text-anchor="middle" fill="rgba(255,255,255,0.75)" class="tr-mono" font-size="8.5">Cloud &amp; Play Store</text>
      <text x="67" y="94" text-anchor="middle" fill="#ffb84d" class="tr-mono" font-size="8">GRADE S+</text>
    </g>

    <!-- Badge 6: Cyber & ISRO -->
    <g transform="translate(725, 0)">
      <rect width="135" height="105" rx="12" fill="url(#tr-glass)" stroke="rgba(255,0,122,0.35)" stroke-width="1"/>
      <text x="67" y="38" text-anchor="middle" font-size="24">🛡️</text>
      <text x="67" y="66" text-anchor="middle" fill="#ff76ac" class="tr-title" font-size="10.5">CYBER &amp; ISRO</text>
      <text x="67" y="82" text-anchor="middle" fill="rgba(255,255,255,0.75)" class="tr-mono" font-size="8.5">Deloitte &amp; Space</text>
      <text x="67" y="94" text-anchor="middle" fill="#ff76ac" class="tr-mono" font-size="8">GRADE S+</text>
    </g>
  </g>
</svg>
