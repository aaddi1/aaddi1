  <circle cx="36" cy="31" r="4" fill="#3fb950" class="pulse-dot"/>
  <text x="48" y="35" fill="#c9d1d9" class="t-mono" font-size="11" font-weight="600">VERIFIED HONORS &amp; SPECIALIZATION VAULT // 6 KEY DOMAINS</text>
  <text x="735" y="35" fill="#8b949e" class="t-mono" font-size="10.5">ACCREDITED TIERS 🏆</text>

  <!-- Row 1: 3 Cards (Y = 56) -->
  <g transform="translate(20, 56)">
