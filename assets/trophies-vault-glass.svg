      <text x="14" y="84" fill="#c9d1d9" class="t-body" font-size="10.5">• High-Speed Margin Analytics</text>
      <text x="14" y="100" fill="#8b949e" class="t-mono" font-size="9">Python &amp; C++ Interop Engine</text>

      <!-- Bottom Verification Pill -->
      <line x1="12" y1="112" x2="263" y2="112" stroke="#21262d" stroke-width="1"/>
      <circle cx="20" cy="125" r="3" fill="#3fb950" class="pulse-dot"/>
      <text x="28" y="128" fill="#8b949e" class="t-mono" font-size="8.5">VERIFIED S+ TIER</text>
      <text x="200" y="128" fill="#d2a8ff" class="t-mono" font-size="8.5" font-weight="600">MASTER</text>
