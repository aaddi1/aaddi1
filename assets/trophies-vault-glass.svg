      <text x="56" y="27" fill="#f0f6fc" class="t-title" font-size="12.5">3D SPATIAL ENGINE</text>
      <text x="56" y="42" fill="#58a6ff" class="t-mono" font-size="9.5">Three.js &amp; WebGL 3D</text>

      <!-- Content Body Lines -->
      <text x="14" y="68" fill="#c9d1d9" class="t-body" font-size="10.5">• Custom GLSL Shaders &amp; Lighting</text>
      <text x="14" y="84" fill="#c9d1d9" class="t-body" font-size="10.5">• Real-time Canvas 3D Kinematics</text>
      <text x="14" y="100" fill="#8b949e" class="t-mono" font-size="9">Cinder House &amp; 3D Portfolio</text>

      <!-- Bottom Verification Pill -->
      <line x1="12" y1="112" x2="263" y2="112" stroke="#21262d" stroke-width="1"/>
      <circle cx="20" cy="125" r="3" fill="#3fb950" class="pulse-dot"/>
      <text x="28" y="128" fill="#8b949e" class="t-mono" font-size="8.5">VERIFIED S+ TIER</text>
      <text x="200" y="128" fill="#58a6ff" class="t-mono" font-size="8.5" font-weight="600">MASTER</text>
    </g>

    <!-- Card 2: Server Architecture -->
