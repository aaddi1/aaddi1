      <text x="219" y="24" text-anchor="middle" fill="#d2a8ff" class="t-mono" font-size="8.5" font-weight="700">SYSTEMS</text>
      
      <text x="56" y="27" fill="#f0f6fc" class="t-title" font-size="12.5">C++ COMPUTATION</text>
      <text x="56" y="42" fill="#d2a8ff" class="t-mono" font-size="9.5">Compiled Math &amp; Logic</text>

