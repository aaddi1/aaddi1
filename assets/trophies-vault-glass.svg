<svg width="900" height="375" viewBox="0 0 900 375" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rainbow Border Gradient -->
    <linearGradient id="tr-rainbow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="25%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="75%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <!-- Translucent Glass Fill -->
    <linearGradient id="tr-glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <style>
      @keyframes rainbowShift {
        0% { filter: hue-rotate(0deg); }
        50% { filter: hue-rotate(180deg); }
        100% { filter: hue-rotate(360deg); }
      }
      @keyframes pulseGreen {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px #3fb950); }
        50% { opacity: 0.5; }
      }
      .tr-rainbow { animation: rainbowShift 10s linear infinite; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 0.5px; }
      .t-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .pulse-dot { animation: pulseGreen 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Outer Liquid Glass Frame -->
  <rect x="5" y="5" width="890" height="365" rx="14" fill="url(#tr-glass-fill)"/>
