<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Ambient Gradients -->
    <radialGradient id="tr-glow-1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tr-glow-2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Fill -->
    <linearGradient id="card-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="card-border-gh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#484f58"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>

    <!-- Shimmer Animation -->
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <style>
      @keyframes floatIso {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-3px) rotate(1deg); }
      }
      @keyframes pulseGreen {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px #3fb950); }
        50% { opacity: 0.5; }
      }
      @keyframes shimmerSweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      .t-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 0.5px; }
      .t-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .pulse-dot { animation: pulseGreen 2s infinite ease-in-out; }
      .floating-card { animation: floatIso 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="900" height="360" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect width="900" height="360" rx="12" fill="url(#tr-glow-1)"/>
  <rect width="900" height="360" rx="12" fill="url(#tr-glow-2)"/>

  <!-- Top Header Title Bar -->
