      <text x="219" y="24" text-anchor="middle" fill="#ff7b72" class="t-mono" font-size="8.5" font-weight="700">ENTERPRISE</text>
      
      <text x="56" y="27" fill="#f0f6fc" class="t-title" font-size="12.5">DELOITTE &amp; ISRO</text>
