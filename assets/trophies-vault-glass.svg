    <g transform="translate(0, 0)">
      <rect width="275" height="138" rx="8" fill="url(#card-grad-bg)" stroke="url(#card-border-gh)" stroke-width="1.2"/>
      <path d="M 6 1 L 269 1" stroke="#58a6ff" stroke-opacity="0.6" stroke-width="1.5"/>
      
      <!-- Top Header Row -->
