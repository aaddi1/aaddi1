      <line x1="12" y1="112" x2="263" y2="112" stroke="#21262d" stroke-width="1"/>
      <circle cx="20" cy="125" r="3" fill="#3fb950" class="pulse-dot"/>
      <text x="28" y="128" fill="#8b949e" class="t-mono" font-size="8.5">VERIFIED S+ TIER</text>
      <text x="200" y="128" fill="#e3b341" class="t-mono" font-size="8.5" font-weight="600">MASTER</text>
    </g>

    <!-- Card 6: Deloitte & ISRO -->
