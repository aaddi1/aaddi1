    <!-- Card 5: AWS & Google Play -->
    <g transform="translate(292, 0)">
      <rect width="275" height="138" rx="8" fill="url(#card-grad-bg)" stroke="url(#card-border-gh)" stroke-width="1.2"/>
      <path d="M 6 1 L 269 1" stroke="#e3b341" stroke-opacity="0.6" stroke-width="1.5"/>
      
      <!-- Top Header Row -->
      <rect x="12" y="12" width="36" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="30" y="36" text-anchor="middle" font-size="18">☁️</text>
      
      <rect x="175" y="12" width="88" height="18" rx="4" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="219" y="24" text-anchor="middle" fill="#e3b341" class="t-mono" font-size="8.5" font-weight="700">CLOUD ARCH</text>
      
      <text x="56" y="27" fill="#f0f6fc" class="t-title" font-size="12.5">AWS &amp; PLAY STORE</text>
