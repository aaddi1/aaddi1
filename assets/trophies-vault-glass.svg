      <text x="14" y="84" fill="#c9d1d9" class="t-body" font-size="10.5">• ISRO / IIRS Outreach Program</text>
      <text x="14" y="100" fill="#8b949e" class="t-mono" font-size="9">Bank of America &amp; Mastercard</text>

