      <text x="56" y="42" fill="#3fb950" class="t-mono" font-size="9.5">Node.js &amp; Express</text>

      <!-- Content Body Lines -->
      <text x="14" y="68" fill="#c9d1d9" class="t-body" font-size="10.5">• High-Concurrency REST Routing</text>
      <text x="14" y="84" fill="#c9d1d9" class="t-body" font-size="10.5">• Multi-Tenant Token Security</text>
      <text x="14" y="100" fill="#8b949e" class="t-mono" font-size="9">NEXUS Platform Core Server</text>

      <!-- Bottom Verification Pill -->
