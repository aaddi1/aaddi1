<svg width="900" height="295" viewBox="0 0 900 295" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rainbow Border Gradient -->
    <linearGradient id="t-rainbow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="25%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="75%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <style>
      :root {
        --text-p: #f0f6fc;
        --text-s: #8b949e;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-card: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.1);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --text-p: #1f2328;
          --text-s: #59636e;
          --glass-bg: rgba(0, 0, 0, 0.025);
          --glass-card: rgba(0, 0, 0, 0.035);
          --glass-border: rgba(0, 0, 0, 0.1);
        }
      }
      @keyframes rainbowShift {
        0% { filter: hue-rotate(0deg); }
        50% { filter: hue-rotate(180deg); }
        100% { filter: hue-rotate(360deg); }
      }
      .t-rainbow { animation: rainbowShift 10s linear infinite; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: var(--text-s); }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--text-s); }
      .t-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; }
      .t-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; }
      .g-outer { fill: var(--glass-bg); }
      .g-inner { fill: var(--glass-card); }
    </style>
  </defs>

  <!-- Outer Liquid Glass Frame -->
  <rect x="5" y="5" width="890" height="285" rx="14" class="g-outer"/>
  <rect x="5" y="5" width="890" height="285" rx="14" fill="none" stroke="url(#t-rainbow-border)" stroke-width="2" class="t-rainbow"/>

  <!-- Top Header Bar -->
  <rect x="20" y="16" width="860" height="34" rx="8" class="g-inner" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="36" cy="33" r="4" fill="#3fb950"/>
  <text x="48" y="37" class="t-mono" font-size="11" font-weight="600">DEVELOPER TELEMETRY &amp; ENGINEERING SCOPE // ARYAN SHARMA</text>
  <text x="735" y="37" class="t-mono" font-size="10.5">FULL-STACK CORE ⚡</text>

  <!-- 4 Stat Cards -->
  <g transform="translate(20, 60)">
    <!-- Stat Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="205" height="98" rx="8" class="g-inner" stroke="url(#t-rainbow-border)" stroke-width="1.2" class="t-rainbow"/>
      <text x="14" y="24" class="t-mono" font-size="9" font-weight="600">CREDENTIALS VAULT</text>
      <text x="14" y="56" fill="#0969da" class="t-num" font-size="28">17+</text>
      <text x="14" y="74" class="t-sans" font-size="10.5">Verified Certifications</text>
      <text x="14" y="88" fill="#0969da" class="t-mono" font-size="8.5">AWS • Oracle • Google</text>
    </g>

    <!-- Stat Card 2 -->
    <g transform="translate(218, 0)">
      <rect width="205" height="98" rx="8" class="g-inner" stroke="url(#t-rainbow-border)" stroke-width="1.2" class="t-rainbow"/>
      <text x="14" y="24" class="t-mono" font-size="9" font-weight="600">ENTERPRISE SIMS</text>
      <text x="14" y="56" fill="#8250df" class="t-num" font-size="28">4</text>
      <text x="14" y="74" class="t-sans" font-size="10.5">Industry Simulations</text>
      <text x="14" y="88" fill="#8250df" class="t-mono" font-size="8.5">Deloitte • BCG • BofA</text>
    </g>

    <!-- Stat Card 3 -->
    <g transform="translate(436, 0)">
      <rect width="205" height="98" rx="8" class="g-inner" stroke="url(#t-rainbow-border)" stroke-width="1.2" class="t-rainbow"/>
      <text x="14" y="24" class="t-mono" font-size="9" font-weight="600">PRODUCTION BUILDS</text>
      <text x="14" y="56" fill="#1a7f37" class="t-num" font-size="28">7+</text>
      <text x="14" y="74" class="t-sans" font-size="10.5">Full-Stack &amp; 3D Apps</text>
      <text x="14" y="88" fill="#1a7f37" class="t-mono" font-size="8.5">NEXUS • Cinder House</text>
    </g>

    <!-- Stat Card 4 -->
    <g transform="translate(654, 0)">
      <rect width="205" height="98" rx="8" class="g-inner" stroke="url(#t-rainbow-border)" stroke-width="1.2" class="t-rainbow"/>
      <text x="14" y="24" class="t-mono" font-size="9" font-weight="600">ENGINEERING SCOPE</text>
      <text x="14" y="56" fill="#cf222e" class="t-num" font-size="28">E2E</text>
      <text x="14" y="74" class="t-sans" font-size="10.5">Design, Server, DB, 3D</text>
      <text x="14" y="88" fill="#cf222e" class="t-mono" font-size="8.5">100% Solo Architecture</text>
    </g>
  </g>

  <!-- Lower Architectural Pillars -->
  <g transform="translate(20, 172)">
    <rect width="860" height="106" rx="8" class="g-inner" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Pillar 1: Custom Servers -->
    <g transform="translate(18, 16)">
      <rect width="198" height="74" rx="6" class="g-inner" stroke="url(#t-rainbow-border)" stroke-width="0.8" class="t-rainbow"/>
      <text x="12" y="22" fill="#0969da" class="t-bold" font-size="11.5">🖥️ SERVER ENGINES</text>
      <text x="12" y="38" class="t-mono" font-size="9">Node.js • Express</text>
      <text x="12" y="52" class="t-mono" font-size="8.5">REST APIs • Microservices</text>
      <rect x="12" y="58" width="56" height="12" rx="3" fill="#339933" fill-opacity="0.3"/>
      <text x="40" y="67" text-anchor="middle" fill="#1a7f37" class="t-mono" font-size="7.5" font-weight="700">NODE.JS</text>
    </g>

    <!-- Pillar 2: Relational SQL -->
    <g transform="translate(230, 16)">
      <rect width="198" height="74" rx="6" class="g-inner" stroke="url(#t-rainbow-border)" stroke-width="0.8" class="t-rainbow"/>
      <text x="12" y="22" fill="#1a7f37" class="t-bold" font-size="11.5">🗄️ SQL &amp; SCHEMAS</text>
      <text x="12" y="38" class="t-mono" font-size="9">PostgreSQL • Complex SQL</text>
      <text x="12" y="52" class="t-mono" font-size="8.5">Relational DB Architecture</text>
      <rect x="12" y="58" width="68" height="12" rx="3" fill="#336791" fill-opacity="0.3"/>
      <text x="46" y="67" text-anchor="middle" fill="#0969da" class="t-mono" font-size="7.5" font-weight="700">POSTGRES</text>
    </g>

    <!-- Pillar 3: C++ & Python Analytics -->
    <g transform="translate(442, 16)">
      <rect width="198" height="74" rx="6" class="g-inner" stroke="url(#t-rainbow-border)" stroke-width="0.8" class="t-rainbow"/>
      <text x="12" y="22" fill="#8250df" class="t-bold" font-size="11.5">⚡ C++ &amp; ANALYTICS</text>
      <text x="12" y="38" class="t-mono" font-size="9">Compiled C++ Modules</text>
      <text x="12" y="52" class="t-mono" font-size="8.5">Python Predictive Logic</text>
      <rect x="12" y="58" width="50" height="12" rx="3" fill="#00599c" fill-opacity="0.3"/>
      <text x="37" y="67" text-anchor="middle" fill="#8250df" class="t-mono" font-size="7.5" font-weight="700">C++ CORE</text>
    </g>

    <!-- Pillar 4: 3D Spatial Graphics -->
    <g transform="translate(654, 16)">
      <rect width="190" height="74" rx="6" class="g-inner" stroke="url(#t-rainbow-border)" stroke-width="0.8" class="t-rainbow"/>
      <text x="12" y="22" fill="#bc4c00" class="t-bold" font-size="11.5">🌐 3D SPATIAL UI</text>
      <text x="12" y="38" class="t-mono" font-size="9">Three.js • WebGL</text>
      <text x="12" y="52" class="t-mono" font-size="8.5">Canvas &amp; Shaders Engine</text>
      <rect x="12" y="58" width="58" height="12" rx="3" fill="#58a6ff" fill-opacity="0.2"/>
      <text x="41" y="67" text-anchor="middle" fill="#0969da" class="t-mono" font-size="7.5" font-weight="700">THREE.JS</text>
    </g>
  </g>
</svg>
