<svg width="900" height="295" viewBox="0 0 900 295" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .t-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; }
      .t-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="900" height="295" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Header Bar -->
  <rect x="20" y="14" width="860" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="36" cy="31" r="4" fill="#238636"/>
  <text x="48" y="35" fill="#c9d1d9" class="t-mono" font-size="11" font-weight="600">DEVELOPER TELEMETRY &amp; ENGINEERING SCOPE // ARYAN SHARMA</text>
  <text x="735" y="35" fill="#8b949e" class="t-mono" font-size="10.5">FULL-STACK CORE ⚡</text>

  <!-- 4 Stat Cards -->
  <g transform="translate(20, 58)">
    <!-- Stat Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="205" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M 4 1 L 201 1" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="14" y="24" fill="#8b949e" class="t-mono" font-size="9" font-weight="600">CREDENTIALS VAULT</text>
      <text x="14" y="58" fill="#58a6ff" class="t-num" font-size="28">17+</text>
      <text x="14" y="76" fill="#8b949e" class="t-sans" font-size="10.5">Verified Certifications</text>
      <text x="14" y="90" fill="#58a6ff" class="t-mono" font-size="8.5">AWS • Oracle • Google</text>
    </g>

    <!-- Stat Card 2 -->
    <g transform="translate(218, 0)">
      <rect width="205" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M 4 1 L 201 1" stroke="#d2a8ff" stroke-width="1.5"/>
      <text x="14" y="24" fill="#8b949e" class="t-mono" font-size="9" font-weight="600">ENTERPRISE SIMS</text>
      <text x="14" y="58" fill="#d2a8ff" class="t-num" font-size="28">4</text>
      <text x="14" y="76" fill="#8b949e" class="t-sans" font-size="10.5">Industry Simulations</text>
      <text x="14" y="90" fill="#d2a8ff" class="t-mono" font-size="8.5">Deloitte • BCG • BofA</text>
    </g>

    <!-- Stat Card 3 -->
    <g transform="translate(436, 0)">
      <rect width="205" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M 4 1 L 201 1" stroke="#3fb950" stroke-width="1.5"/>
      <text x="14" y="24" fill="#8b949e" class="t-mono" font-size="9" font-weight="600">PRODUCTION BUILDS</text>
      <text x="14" y="58" fill="#3fb950" class="t-num" font-size="28">7+</text>
      <text x="14" y="76" fill="#8b949e" class="t-sans" font-size="10.5">Full-Stack &amp; 3D Apps</text>
      <text x="14" y="90" fill="#3fb950" class="t-mono" font-size="8.5">NEXUS • Cinder House</text>
    </g>

    <!-- Stat Card 4 -->
    <g transform="translate(654, 0)">
      <rect width="205" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <path d="M 4 1 L 201 1" stroke="#f0883e" stroke-width="1.5"/>
      <text x="14" y="24" fill="#8b949e" class="t-mono" font-size="9" font-weight="600">ENGINEERING SCOPE</text>
      <text x="14" y="58" fill="#f0883e" class="t-num" font-size="28">E2E</text>
      <text x="14" y="76" fill="#8b949e" class="t-sans" font-size="10.5">Design, Server, DB, 3D</text>
      <text x="14" y="90" fill="#f0883e" class="t-mono" font-size="8.5">100% Solo Architecture</text>
    </g>
  </g>

  <!-- Lower Architectural Pillars -->
  <g transform="translate(20, 172)">
    <rect width="860" height="106" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <!-- Pillar 1: Custom Servers -->
    <g transform="translate(18, 16)">
      <rect width="198" height="74" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#58a6ff" class="t-bold" font-size="11.5">🖥️ SERVER ENGINES</text>
      <text x="12" y="38" fill="#c9d1d9" class="t-mono" font-size="9">Node.js • Express</text>
      <text x="12" y="52" fill="#8b949e" class="t-mono" font-size="8.5">REST APIs • Microservices</text>
      <rect x="12" y="58" width="56" height="12" rx="3" fill="#339933" fill-opacity="0.3"/>
      <text x="40" y="67" text-anchor="middle" fill="#39d353" class="t-mono" font-size="7.5" font-weight="700">NODE.JS</text>
    </g>

    <!-- Pillar 2: Relational SQL -->
    <g transform="translate(230, 16)">
      <rect width="198" height="74" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#3fb950" class="t-bold" font-size="11.5">🗄️ SQL &amp; SCHEMAS</text>
      <text x="12" y="38" fill="#c9d1d9" class="t-mono" font-size="9">PostgreSQL • Complex SQL</text>
      <text x="12" y="52" fill="#8b949e" class="t-mono" font-size="8.5">Relational DB Architecture</text>
      <rect x="12" y="58" width="68" height="12" rx="3" fill="#336791" fill-opacity="0.3"/>
      <text x="46" y="67" text-anchor="middle" fill="#79c0ff" class="t-mono" font-size="7.5" font-weight="700">POSTGRES</text>
    </g>

    <!-- Pillar 3: C++ & Python Analytics -->
    <g transform="translate(442, 16)">
      <rect width="198" height="74" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#d2a8ff" class="t-bold" font-size="11.5">⚡ C++ &amp; ANALYTICS</text>
      <text x="12" y="38" fill="#c9d1d9" class="t-mono" font-size="9">Compiled C++ Modules</text>
      <text x="12" y="52" fill="#8b949e" class="t-mono" font-size="8.5">Python Predictive Logic</text>
      <rect x="12" y="58" width="50" height="12" rx="3" fill="#00599c" fill-opacity="0.3"/>
      <text x="37" y="67" text-anchor="middle" fill="#d2a8ff" class="t-mono" font-size="7.5" font-weight="700">C++ CORE</text>
    </g>

    <!-- Pillar 4: 3D Spatial Graphics -->
    <g transform="translate(654, 16)">
      <rect width="190" height="74" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#f0883e" class="t-bold" font-size="11.5">🌐 3D SPATIAL UI</text>
      <text x="12" y="38" fill="#c9d1d9" class="t-mono" font-size="9">Three.js • WebGL</text>
      <text x="12" y="52" fill="#8b949e" class="t-mono" font-size="8.5">Canvas &amp; Shaders Engine</text>
      <rect x="12" y="58" width="58" height="12" rx="3" fill="#58a6ff" fill-opacity="0.2"/>
      <text x="41" y="67" text-anchor="middle" fill="#58a6ff" class="t-mono" font-size="7.5" font-weight="700">THREE.JS</text>
    </g>
  </g>
</svg>
