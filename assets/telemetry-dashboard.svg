<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .t-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; }
      .t-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="900" height="280" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Header Bar -->
  <rect x="20" y="16" width="860" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="36" cy="33" r="4" fill="#238636"/>
  <text x="48" y="37" fill="#c9d1d9" class="t-mono" font-size="11" font-weight="600">ENGINEERING OVERVIEW // ARYAN SHARMA</text>
  <text x="735" y="37" fill="#8b949e" class="t-mono" font-size="10.5">FULL-STACK CORE</text>

  <!-- 4 Stat Cards -->
  <g transform="translate(20, 60)">
    <!-- Stat Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="205" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="26" fill="#8b949e" class="t-mono" font-size="9.5" font-weight="600">CREDENTIALS VAULT</text>
      <text x="16" y="60" fill="#58a6ff" class="t-num" font-size="28">17+</text>
      <text x="16" y="78" fill="#8b949e" class="t-sans" font-size="10.5">Verified Certifications</text>
    </g>

    <!-- Stat Card 2 -->
    <g transform="translate(218, 0)">
      <rect width="205" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="26" fill="#8b949e" class="t-mono" font-size="9.5" font-weight="600">ENTERPRISE SIMS</text>
      <text x="16" y="60" fill="#d2a8ff" class="t-num" font-size="28">4</text>
      <text x="16" y="78" fill="#8b949e" class="t-sans" font-size="10.5">Deloitte, BCG, BofA, MC</text>
    </g>

    <!-- Stat Card 3 -->
    <g transform="translate(436, 0)">
      <rect width="205" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="26" fill="#8b949e" class="t-mono" font-size="9.5" font-weight="600">PRODUCTION APPS</text>
      <text x="16" y="60" fill="#3fb950" class="t-num" font-size="28">7+</text>
      <text x="16" y="78" fill="#8b949e" class="t-sans" font-size="10.5">Full-Stack &amp; 3D Builds</text>
    </g>

    <!-- Stat Card 4 -->
    <g transform="translate(654, 0)">
      <rect width="205" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="26" fill="#8b949e" class="t-mono" font-size="9.5" font-weight="600">ENGINEERING SCOPE</text>
      <text x="16" y="60" fill="#f0883e" class="t-num" font-size="28">E2E</text>
      <text x="16" y="78" fill="#8b949e" class="t-sans" font-size="10.5">Server, DB, 3D, Deploy</text>
    </g>
  </g>

  <!-- Lower Architectural Pillars -->
  <g transform="translate(20, 164)">
    <rect width="860" height="98" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <!-- Pillar 1: Custom Servers -->
    <g transform="translate(18, 16)">
      <rect width="198" height="66" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#58a6ff" class="t-bold" font-size="11.5">🖥️ SERVER ENGINES</text>
      <text x="12" y="40" fill="#c9d1d9" class="t-mono" font-size="9">Node.js • Express</text>
      <text x="12" y="54" fill="#8b949e" class="t-mono" font-size="8.5">REST APIs • Microservices</text>
    </g>

    <!-- Pillar 2: Relational SQL -->
    <g transform="translate(230, 16)">
      <rect width="198" height="66" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#3fb950" class="t-bold" font-size="11.5">🗄️ SQL &amp; SCHEMAS</text>
      <text x="12" y="40" fill="#c9d1d9" class="t-mono" font-size="9">PostgreSQL • Complex SQL</text>
      <text x="12" y="54" fill="#8b949e" class="t-mono" font-size="8.5">Relational DB Architecture</text>
    </g>

    <!-- Pillar 3: C++ & Python Analytics -->
    <g transform="translate(442, 16)">
      <rect width="198" height="66" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#d2a8ff" class="t-bold" font-size="11.5">⚡ C++ &amp; ANALYTICS</text>
      <text x="12" y="40" fill="#c9d1d9" class="t-mono" font-size="9">Compiled C++ Modules</text>
      <text x="12" y="54" fill="#8b949e" class="t-mono" font-size="8.5">Python Predictive Logic</text>
    </g>

    <!-- Pillar 4: 3D Spatial Graphics -->
    <g transform="translate(654, 16)">
      <rect width="190" height="66" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#f0883e" class="t-bold" font-size="11.5">🌐 3D SPATIAL UI</text>
      <text x="12" y="40" fill="#c9d1d9" class="t-mono" font-size="9">Three.js • WebGL</text>
      <text x="12" y="54" fill="#8b949e" class="t-mono" font-size="8.5">Canvas &amp; Shaders Engine</text>
    </g>
  </g>
</svg>
